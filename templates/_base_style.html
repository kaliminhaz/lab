<style>
  :root{
    --purple:#6C2BE0; --purple-deep:#4B18A8; --pink:#FF3D81; --yellow:#FFD400;
    --ink:#14121F; --paper:#FBF7F0; --green:#B9F27C;
    --display:'Unbounded',sans-serif; --body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  html{background:var(--paper);}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:920px;margin:0 auto;padding:0 clamp(20px,5vw,56px);}
  h1,h2,h3{font-family:var(--display);margin:0;}
  p{margin:0;}
  a{color:inherit;}
  .btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:16px;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:100px;padding:16px 30px;text-decoration:none;cursor:pointer;box-shadow:5px 5px 0 var(--ink);}
  .btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink);}
  .btn.ghost{background:#fff;}
  .btn.danger{background:var(--pink);color:#fff;}

  .topbar{background:var(--ink);}
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(20px,5vw,56px);max-width:920px;margin:0 auto;}
  .brand{font-family:var(--display);font-weight:700;font-size:16px;color:var(--paper);}
  .day-pill{font-family:var(--display);font-weight:700;font-size:13px;background:var(--yellow);color:var(--ink);padding:7px 16px;border-radius:100px;}

  .hero{background:var(--purple);color:#fff;position:relative;padding:clamp(50px,9vw,86px) 0 clamp(56px,8vw,90px);overflow:hidden;}
  .blob{position:absolute;border-radius:50%;opacity:0.9;}
  .b1{width:300px;height:300px;background:var(--pink);top:-130px;right:-90px;}
  .b2{width:160px;height:160px;background:var(--yellow);bottom:-60px;left:-55px;}
  .hero .wrap{position:relative;z-index:2;text-align:center;}
  .hero .tagline{display:inline-block;font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:0.08em;background:var(--yellow);color:var(--ink);padding:8px 18px;border-radius:100px;margin-bottom:20px;}
  .hero h1{font-size:clamp(32px,5.6vw,52px);line-height:1.08;letter-spacing:-0.01em;margin:0 auto 16px;max-width:20ch;}
  .hero p.lede{font-size:clamp(15px,1.8vw,17.5px);line-height:1.6;color:#EDE4FF;max-width:50ch;margin:0 auto;}

  section{padding:clamp(40px,6vw,64px) 0;}

  .card{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:30px 30px;box-shadow:6px 6px 0 var(--ink);max-width:560px;margin:-46px auto 0;position:relative;z-index:3;}
  .card label{display:block;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:0.05em;color:var(--purple);margin-bottom:8px;margin-top:18px;}
  .card label:first-of-type{margin-top:0;}
  .card input{width:100%;font-family:var(--body);font-size:16px;padding:14px 16px;border:2.5px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);}
  .card input:focus{outline:none;border-color:var(--purple);}
  .card .submit-row{margin-top:24px;}
  .card .submit-row button{width:100%;font-size:16px;border:none;}

  .error-box{background:var(--pink);color:#fff;font-family:var(--body);font-weight:600;font-size:14px;line-height:1.5;padding:14px 16px;border-radius:12px;border:2.5px solid var(--ink);margin-bottom:18px;}

  .terminal-block{background:#0b0a12;border:3px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);}
  .terminal-bar{display:flex;align-items:center;gap:8px;background:#1c1a29;padding:10px 16px;}
  .terminal-dot{width:11px;height:11px;border-radius:50%;}
  .terminal-dot.r{background:#FF5F57;} .terminal-dot.y{background:#FFBD2E;} .terminal-dot.g{background:#28C840;}
  .terminal-title{font-family:var(--display);font-weight:700;font-size:11.5px;color:#8b85a3;margin-left:8px;}
  .terminal-body{font-family:'SFMono-Regular',Consolas,monospace;font-size:13px;line-height:1.85;padding:18px 20px;color:#E8E4F5;overflow-x:auto;word-break:break-all;}
  .t-out{color:#9d97b8;} .t-in{color:#8FD8FF;} .t-win{color:var(--green);font-weight:700;}

  .eyebrow{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:0.08em;color:var(--purple);margin-bottom:8px;}
  .kicker{font-family:var(--display);font-weight:700;font-size:clamp(20px,3vw,26px);line-height:1.2;margin:0 0 14px;}
  p.body-txt{font-size:15.5px;line-height:1.75;max-width:640px;}

  .callout{display:flex;gap:12px;align-items:flex-start;border:3px solid var(--ink);border-radius:16px;padding:18px 20px;box-shadow:6px 6px 0 var(--ink);}
  .callout.tip{background:var(--yellow);color:var(--ink);}
  .callout.danger{background:var(--pink);color:#fff;}
  .callout.win{background:var(--green);color:var(--ink);}
  .callout-icon{font-size:20px;line-height:1;flex-shrink:0;}
  .callout-text{font-size:14.5px;line-height:1.6;font-weight:600;}

  .flag-card{background:var(--ink);color:#fff;border-radius:18px;padding:26px 26px;box-shadow:6px 6px 0 var(--pink);}
  .flag-card .fl-tag{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:0.06em;color:var(--green);margin-bottom:10px;}
  .flag-card .fl-val{font-family:'SFMono-Regular',Consolas,monospace;font-size:19px;font-weight:700;color:var(--yellow);word-break:break-all;background:rgba(255,255,255,0.06);padding:14px 16px;border-radius:10px;border:2px dashed rgba(255,212,0,0.5);}

  footer{background:var(--ink);padding:22px clamp(20px,5vw,56px);text-align:center;}
  footer p{font-family:var(--body);font-weight:600;font-size:12px;color:#8b85a3;margin:0;}
</style>
